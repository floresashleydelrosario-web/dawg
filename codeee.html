
<html>
<head>
    <title>IT Help Desk</title>

    
</head>

<body>

    <h2>IT Help Desk</h2>

   

    <h3>Submit a Ticket</h3>

    <label>Requester Name:</label>
    <input type="text" id="name" placeholder="Type your name...">
    <br>

    <label>Requester Room:</label>
    <input type="text" id="room" placeholder="Type your room...">
    <br>

    <label>Issue (Category):</label>
    <select id="issue">
        <option>Computer broken (Hardware)</option>
        <option>No Internet (Network)</option>
        <option>App not opening (Software)</option>
    </select>
    <br>

    <labelProblem Description:</label>
    <textarea id="description"
        placeholder="Describe the problem you are experiencing..."></textarea>
    <br>

    <labal>Priority:</label>
    <select id="priority">
        <option>High</option>
        <option selected>Medium</option>
        <option>Low</option>
    </select>
    <br>

    <button id="submitBtn" onclick="addTicket()">
        Submit Ticket
    </button>

    <button id="cancelBtn"
        class="cancel-btn"
        onclick="cancelEdit()"
        style="display:none;">
        Cancel Edit
    </button>

 

    <h3>Tickets List</h3>

    <table id="myTable">
        <thead>
            <tr>
                <th>Room</th>
                <th>Requester</th>
                <th>Issue</th>
                <th>Problem Description</th>
                <th>Priority</th>
                <th>Status</th>
                <th>Assigned Technician</th>
                <th>Resolution</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody>
            
        </tbody>
    </table>

    <script>
      
        var editingRow = null;

        
        var technicians = [
            "Alex Rivera",
            "Sarah Chen",
            "Marcus Vance"
        ];

        function addTicket() {

            var room = document.getElementById("room").value.trim();
            var name = document.getElementById("name").value.trim();
            var issue = document.getElementById("issue").value;
            var description =
                document.getElementById("description").value.trim();
            var priority = document.getElementById("priority").value;

            if (name === "") {
                alert("Please enter your name!");
                return;
            }

            if (room === "") {
                alert("Please enter your room!");
                return;
            }

            if (description === "") {
                alert("Please describe the problem!");
                return;
            }

            
            var values = [
                room,
                name,
                issue,
                description,
                priority
            ];

            
            if (editingRow !== null) {

                for (var i = 0; i < values.length; i++) {
                    editingRow.cells[i].textContent = values[i];
                }

                alert("Ticket Updated!");
                cancelEdit();
                return;
            }

            var randomIndex = Math.floor(
                Math.random() * technicians.length
            );

            var randomTech = technicians[randomIndex];

            var table = document.getElementById("myTable")
                .getElementsByTagName("tbody")[0];

            var row = table.insertRow();

            for (var i = 0; i < values.length; i++) {
                var cell = row.insertCell();
                cell.textContent = values[i];
            }

            row.insertCell().textContent = "Open";

            row.insertCell().textContent = randomTech;

            row.insertCell().textContent = "Pending";

            var actionCell = row.insertCell();

            var editButton = document.createElement("button");
            editButton.textContent = "Edit";
            editButton.className = "edit-btn";
            editButton.onclick = function() {
                editTicket(this);
            };

            var deleteButton = document.createElement("button");
            deleteButton.textContent = "Delete";
            deleteButton.className = "delete-btn";
            deleteButton.onclick = function() {
                deleteTicket(this);
            };

            actionCell.appendChild(editButton);
            actionCell.appendChild(deleteButton);

            alert(
                "Ticket Submitted Successfully!\n" +
                "Assigned Technician: " + randomTech
            );

            clearForm();
        }

  
        function editTicket(button) {

            editingRow = button.closest("tr");

            document.getElementById("room").value =
                editingRow.cells[0].textContent;

            document.getElementById("name").value =
                editingRow.cells[1].textContent;

            document.getElementById("issue").value =
                editingRow.cells[2].textContent;

            document.getElementById("description").value =
                editingRow.cells[3].textContent;

            document.getElementById("priority").value =
                editingRow.cells[4].textContent;

            document.getElementById("submitBtn").textContent =
                "Update Ticket";

            document.getElementById("cancelBtn").style.display =
                "inline-block";

            window.scrollTo(0, 0);
        }

        function deleteTicket(button) {

            var row = button.closest("tr");

            if (!confirm("Are you sure you want to delete this ticket?")) {
                return;
            }

            if (editingRow === row) {
                cancelEdit();
            }

            row.remove();
            alert("Ticket Deleted!");
        }

   
        function cancelEdit() {

            editingRow = null;

            document.getElementById("submitBtn").textContent =
                "Submit Ticket";

            document.getElementById("cancelBtn").style.display =
                "none";

            clearForm();
        }

        
        function clearForm() {

            document.getElementById("name").value = "";
            document.getElementById("room").value = "";
            document.getElementById("issue").selectedIndex = 0;
            document.getElementById("description").value = "";
            document.getElementById("priority").value = "Medium";
        }
    </script>

</body>
</html>
